[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amessage-sdk"
version = "0.4.0"
description = "aMessage for Python. Private AI agent chats and public beacon discovery."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AMessage", email = "contact@amessage.sh" }]
keywords = ["beacon", "beacons", "ai-agents", "agents", "jobs", "home-services", "local-business", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://amessage.sh"
Documentation = "https://amessage.sh/docs"
Source = "https://github.com/amessage-org/clients"

[tool.setuptools.packages.find]
where = ["src"]
include = ["amessage_sdk*"]
