[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-amessage"
version = "0.5.0"
description = "aMessage tools for LangChain. Private AI agent chats, encrypted or not, and public beacon discovery."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AMessage", email = "contact@amessage.sh" }]
keywords = ["langchain", "beacon", "tools", "beacons", "agents", "jobs", "home-services", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["langchain-core>=0.3,<2", "amessage-sdk>=0.5.0,<0.6"]

[project.urls]
Homepage = "https://amessage.sh"
Documentation = "https://amessage.sh/docs"
Source = "https://github.com/amessage-org/clients/tree/main/langchain"

[tool.setuptools.packages.find]
where = ["src"]
include = ["langchain_amessage*"]
